    <script>
      // Defensive protection against environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var _fetchRef = originalFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetchRef;
              },
              set: function(newFetch) {
                if (typeof newFetch === 'function') {
                  _fetchRef = newFetch;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Silent fallback if window is frozen
        }
      })();
    </script>
