<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Outer Arc Left Gradient -->
    <linearGradient id="arc-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Outer Arc Right Gradient -->
    <linearGradient id="arc-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="25%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Left Leaf Gradient -->
    <linearGradient id="leaf-left" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="55%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Right Leaf Gradient -->
    <linearGradient id="leaf-right" x1="90%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Page Gradients -->
    <linearGradient id="page-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <linearGradient id="page-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="river" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Pin Half Gradients -->
    <linearGradient id="pin-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <linearGradient id="pin-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Circular Border Ring -->
  <g id="outer-circle-ring">
    <path d="M 248 58 A 178 178 0 0 0 105 310" fill="none" stroke="url(#arc-left)" stroke-width="11" stroke-linecap="round" />
    <path d="M 252 58 A 178 178 0 0 1 395 310" fill="none" stroke="url(#arc-right)" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- Open Map Book -->
  <g id="open-map-book">
    <path d="M 246 254 L 155 228 C 145 225 132 232 128 244 L 115 304 C 113 313 120 320 128 320 L 234 316 C 242 316 246 312 246 304 Z" fill="url(#page-left)" stroke="#0A4D2E" stroke-width="7" stroke-linejoin="round" />
    <path d="M 121 276 C 160 274 200 278 246 282" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
    <path d="M 183 234 L 174 318" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />

    <path d="M 254 254 L 345 228 C 355 225 368 232 372 244 L 385 304 C 387 313 380 320 372 320 L 266 316 C 258 316 254 312 254 304 Z" fill="url(#page-right)" stroke="#0A4D2E" stroke-width="7" stroke-linejoin="round" />
    <path d="M 254 282 C 300 278 340 274 379 276" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
    <path d="M 317 234 L 326 318" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />

    <!-- River -->
    <path d="M 249 255 C 248 268 244 280 246 295 C 247 304 240 310 234 317 C 246 319 258 319 267 317 C 260 309 254 302 254 294 C 254 281 251 268 251 255 Z" fill="url(#river)" stroke="#0284C7" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Medicinal Plant Leaves -->
  <g id="medicinal-leaves">
    <path d="M 250 258 L 250 185" fill="none" stroke="#0A4D2E" stroke-width="5" stroke-linecap="round" />
    <path d="M 250 252 C 220 250 160 220 148 136 C 185 140 235 180 250 252 Z" fill="url(#leaf-left)" stroke="#0A4D2E" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 245 240 C 225 210 185 168 152 140" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />

    <path d="M 250 252 C 280 250 340 220 352 136 C 315 140 265 180 250 252 Z" fill="url(#leaf-right)" stroke="#0A4D2E" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 255 240 C 275 210 315 168 348 140" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- GPS Pin -->
  <g id="gps-pin">
    <path d="M 250 88 C 234 88 221 101 221 118 C 221 138 245 165 250 173 L 250 88 Z" fill="url(#pin-left)" />
    <path d="M 250 88 C 266 88 279 101 279 118 C 279 138 255 165 250 173 L 250 88 Z" fill="url(#pin-right)" />
    <path d="M 250 88 C 234 88 221 101 221 118 C 221 138 245 165 250 173 C 255 165 279 138 279 118 C 279 101 266 88 250 88 Z" fill="none" stroke="#0A4D2E" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="250" cy="118" r="14" fill="#FFFFFF" stroke="#0A4D2E" stroke-width="2.5" />
    <circle cx="250" cy="118" r="3.5" fill="#0A4D2E" />
  </g>

  <!-- Typography -->
  <g id="branding-typography">
    <text x="250" y="370" text-anchor="middle" fill="#0A4D2E" font-size="50" font-weight="900" letter-spacing="3" font-family="system-ui, -apple-system, sans-serif">HERBMAP</text>
    <g>
      <line x1="145" y1="400" x2="175" y2="400" stroke="#0A4D2E" stroke-width="3.5" stroke-linecap="round" />
      <text x="250" y="407" text-anchor="middle" fill="#0A4D2E" font-size="23" font-weight="800" letter-spacing="4" font-family="system-ui, -apple-system, sans-serif">TAM ANH</text>
      <line x1="325" y1="400" x2="355" y2="400" stroke="#0A4D2E" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <path d="M 118 382 C 160 428 215 444 250 444 C 285 444 340 428 382 382" fill="none" stroke="#0A4D2E" stroke-width="8.5" stroke-linecap="round" />
  </g>
</svg>
